name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true # legacy code has 6.8k pre-existing warnings; lint is informational

      - name: Vitest (unit + integration)
        env:
          NEXT_PUBLIC_AVALANCHE_RPC_URL: ${{ secrets.NEXT_PUBLIC_AVALANCHE_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
          NEXT_PUBLIC_CHAIN_ID: '43113'
          CRON_SECRET: 'ci-test-cron-secret'
          # Layer-B writes only when explicitly authorized (push to main + secret set)
          CI_TEST_WALLET_PRIVATE_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.CI_TEST_WALLET_PRIVATE_KEY }}
          ENABLE_AUTO_CREATE_MIRROR: '0'
        run: npm run test:ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (desktop only on PR; full matrix on push to main)
        env:
          NEXT_PUBLIC_AVALANCHE_RPC_URL: ${{ secrets.NEXT_PUBLIC_AVALANCHE_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
          NEXT_PUBLIC_CHAIN_ID: '43113'
          CRON_SECRET: 'ci-test-cron-secret'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --project=desktop-chromium
          else
            npx playwright test
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
