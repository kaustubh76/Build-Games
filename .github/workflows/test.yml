name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly soak run at 04:17 UTC. Avoids the burst of cron jobs on the hour.
    - cron: '17 4 * * *'

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true # legacy code has 6.8k pre-existing warnings; lint is informational

      - name: Validate env (Fuji baseline — must pass; mainnet vars are warnings here)
        env:
          PRIVATE_KEY: '0x0101010101010101010101010101010101010101010101010101010101010101'
          GAME_MASTER_PRIVATE_KEY: '0x0202020202020202020202020202020202020202020202020202020202020202'
          AI_SIGNER_PRIVATE_KEY: '0x0303030303030303030303030303030303030303030303030303030303030303'
          CRON_SECRET: 'ci-test-cron-secret'
          SESSION_SECRET: 'ci-test-session-secret-must-be-at-least-32-chars'
          DATABASE_URL: 'file:./dev.db'
          NEXT_PUBLIC_CHAIN_ID: '43113'
        run: npm run env:check

      - name: Validate env (mainnet — must FAIL when contract overrides are missing)
        env:
          PRIVATE_KEY: '0x0101010101010101010101010101010101010101010101010101010101010101'
          GAME_MASTER_PRIVATE_KEY: '0x0202020202020202020202020202020202020202020202020202020202020202'
          AI_SIGNER_PRIVATE_KEY: '0x0303030303030303030303030303030303030303030303030303030303030303'
          CRON_SECRET: 'ci-test-cron-secret'
          SESSION_SECRET: 'ci-test-session-secret-must-be-at-least-32-chars'
          DATABASE_URL: 'file:./dev.db'
          NEXT_PUBLIC_CHAIN_ID: '43114'
        # Negative test: validator MUST exit non-zero. We invert the check so a
        # silent pass (which would mean the mainnet guard is broken) fails CI.
        run: |
          if npm run env:check; then
            echo "::error::env-check unexpectedly passed for mainnet without contract overrides — guard is broken"
            exit 1
          else
            echo "env-check correctly failed for misconfigured mainnet"
          fi

      - name: Vitest (unit + integration)
        env:
          NEXT_PUBLIC_AVALANCHE_RPC_URL: ${{ secrets.NEXT_PUBLIC_AVALANCHE_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
          NEXT_PUBLIC_CHAIN_ID: '43113'
          CRON_SECRET: 'ci-test-cron-secret'
          # Layer-B writes only when explicitly authorized (push to main + secret set)
          CI_TEST_WALLET_PRIVATE_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.CI_TEST_WALLET_PRIVATE_KEY }}
          ENABLE_AUTO_CREATE_MIRROR: '0'
        run: npm run test:ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (desktop only on PR; full matrix on push to main)
        env:
          NEXT_PUBLIC_AVALANCHE_RPC_URL: ${{ secrets.NEXT_PUBLIC_AVALANCHE_RPC_URL || 'https://api.avax-test.network/ext/bc/C/rpc' }}
          NEXT_PUBLIC_CHAIN_ID: '43113'
          CRON_SECRET: 'ci-test-cron-secret'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --project=desktop-chromium
          else
            npx playwright test
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  frontend-soak:
    # Soak / chaos suite: hunts race conditions, counter leaks, RPC failover
    # regressions. Runs on nightly schedule + workflow_dispatch only — too slow
    # for every PR, but a safety net catches regressions within 24h.
    name: Frontend soak / chaos
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install deps
        run: npm ci

      - name: Run soak suite
        env:
          # The soak suite mocks the chain layer; no live RPC needed. Set a
          # dummy URL so dotenv-loaded config doesn't complain at startup.
          NEXT_PUBLIC_AVALANCHE_RPC_URL: 'https://api.avax-test.network/ext/bc/C/rpc'
          NEXT_PUBLIC_CHAIN_ID: '43113'
          CRON_SECRET: 'ci-soak-secret'
        run: npm run test:soak

      - name: Upload soak artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: |
            frontend/coverage/
            frontend/test-results/
          retention-days: 7
